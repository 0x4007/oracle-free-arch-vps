[Globals]
ListenPort=sesman.socket
EnableUserWindowManager=false
DefaultWindowManager=/etc/xrdp/startwm.sh
ReconnectScript=/etc/xrdp/reconnectwm.sh

[Security]
AllowRootLogin=false
MaxLoginRetry=4
TerminalServerUsers=rdp-users
AlwaysGroupCheck=true
RestrictOutboundClipboard=none
RestrictInboundClipboard=none
AllowAlternateShell=false
SessionSockdirGroup=xrdp

[Sessions]
X11DisplayOffset=10
MaxSessions=2
KillDisconnected=false
DisconnectedTimeLimit=0
IdleTimeLimit=0
Policy=UB

[Logging]
LogFile=xrdp-sesman.log
LogLevel=INFO
EnableSyslog=true

[Xorg]
param=/usr/lib/Xorg
param=-config
param=xrdp/xorg.conf
param=-noreset
param=-nolisten
param=tcp
param=-logfile
param=.xorgxrdp.%s.log

[Chansrv]
EnableFuseMount=false
FileUmask=077

[ChansrvLogging]
LogLevel=INFO
EnableSyslog=true
