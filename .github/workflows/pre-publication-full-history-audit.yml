name: Pre-publication full-history audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit every reachable commit and archive
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decode and syntax-check the audit payload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/full-history-secret-audit.sh"
          cat \
            .github/audit/full-history-secret-audit.sh.b64.part1 \
            .github/audit/full-history-secret-audit.sh.b64.part2 \
            .github/audit/full-history-secret-audit.sh.b64.part3 \
            | tr -d '\r\n' \
            | base64 --decode \
            > "${payload}"
          sha256sum "${payload}"
          bash -n "${payload}"
          chmod 0600 "${payload}"

      - name: Upload decoded payload for integrity review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decoded-audit-payload-${{ github.run_id }}
          path: ${{ runner.temp }}/full-history-secret-audit.sh
          if-no-files-found: error
          retention-days: 1
